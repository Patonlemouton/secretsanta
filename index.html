<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎅 Secret Santa des Gobelets</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --red: #e63946; --green: #2a9d5c; --gold: #ffd166; --night: #0e1c36;
    --cw: 86px;            /* largeur d'un gobelet */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #fff;
    background:
      radial-gradient(ellipse at 50% -10%, #3b66b3 0%, transparent 55%),
      radial-gradient(ellipse at 90% 40%, rgba(230,57,70,.18), transparent 50%),
      radial-gradient(ellipse at 10% 60%, rgba(42,157,92,.18), transparent 50%),
      linear-gradient(#0e1c36, #0a1226);
    background-attachment: fixed;
    display: flex; justify-content: center; overflow-x: hidden;
  }
  .hidden { display: none !important; }

  /* ---------- Décor ---------- */
  #snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .flake { position: absolute; top: -30px; color: #fff; opacity: .8; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }

  .hills { position: fixed; left: -10%; right: -10%; bottom: -60px; height: 140px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 30% 100% at 20% 100%, #fff 60%, transparent 61%),
      radial-gradient(ellipse 40% 100% at 60% 100%, #e8f1ff 60%, transparent 61%),
      radial-gradient(ellipse 30% 100% at 95% 100%, #fff 60%, transparent 61%);
    filter: drop-shadow(0 -6px 18px rgba(160,200,255,.4)); }

  #garland { position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 5; pointer-events: none; }
  #garland .wire { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .bulb { position: absolute; width: 14px; height: 20px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    animation: blink 1.6s ease-in-out infinite; }
  .bulb::before { content: ""; position: absolute; top: -5px; left: 3px; width: 8px; height: 7px; background: #555; border-radius: 2px; }
  @keyframes blink { 0%,100% { opacity: 1; filter: drop-shadow(0 0 8px currentColor); } 50% { opacity: .35; filter: none; } }

  main { position: relative; z-index: 1; width: min(580px, 94vw); text-align: center; padding: 70px 0 130px; }

  h1 { font-size: 2.6rem; margin: 0; letter-spacing: 1px;
    background: linear-gradient(90deg, #ff6b6b, #ffd166, #6ee7a1, #ffd166, #ff6b6b); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s linear infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  @keyframes shine { to { background-position: 300% 0; } }
  .logo { font-size: 3.2rem; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-6deg); } }
  .sub { opacity: .85; margin: 6px 0 22px; }

  .card { background: rgba(255,255,255,.09); border: 2px solid rgba(255,255,255,.22);
    border-radius: 26px; padding: 22px; backdrop-filter: blur(8px);
    box-shadow: 0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }

  .row { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; width: 100%; padding: 14px 16px; border-radius: 16px; border: 3px solid transparent;
    font-size: 1.05rem; outline: none; transition: border-color .2s, box-shadow .2s; }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(255,209,102,.3); }
  button { cursor: pointer; border: none; border-radius: 16px; padding: 13px 20px; font-size: 1.05rem; font-weight: bold; color: #fff;
    background: linear-gradient(#35c476, var(--green)); box-shadow: 0 5px 0 #1b6e3f, 0 10px 18px rgba(0,0,0,.3);
    transition: transform .12s, box-shadow .12s, filter .2s; }
  button:hover { transform: translateY(-2px); filter: brightness(1.1); }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #1b6e3f; }
  button.red { background: linear-gradient(#ff5b69, var(--red)); box-shadow: 0 5px 0 #a52632, 0 10px 18px rgba(0,0,0,.3); }
  button.red:active { box-shadow: 0 1px 0 #a52632; }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; filter: grayscale(.5); }
  button.ghost { background: rgba(255,255,255,.14); box-shadow: 0 4px 0 rgba(0,0,0,.25); font-size: .95rem; padding: 10px 16px; }
  .big { width: 100%; margin-top: 18px; font-size: 1.25rem; padding: 16px; }
  .pulse { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .link { color: var(--gold); background: none; border: none; box-shadow: none; text-decoration: underline; font-size: .9rem; padding: 6px; font-weight: normal; }
  .link:hover { transform: none; }

  /* ---------- Accueil ---------- */
  .label-top { text-align: left; font-weight: bold; margin: 0 0 8px; opacity: .9; }
  .or { margin: 20px 0 10px; opacity: .75; display: flex; align-items: center; gap: 12px; }
  .or::before, .or::after { content: ""; flex: 1; height: 2px; background: rgba(255,255,255,.2); }
  #codeInput { text-align: center; text-transform: uppercase; font-weight: 900; letter-spacing: .35em; font-size: 1.3rem; }
  .msg { min-height: 1.4em; margin: 14px 0 0; color: #ffb3b9; font-weight: bold; }
  .msg.ok { color: #9af0bd; }

  /* ---------- Salle d'attente ---------- */
  .code { font-size: 3.6rem; font-weight: 900; letter-spacing: .22em; margin: 0 0 6px; padding-left: .22em;
    color: var(--gold); text-shadow: 0 0 24px rgba(255,209,102,.65), 0 4px 0 rgba(0,0,0,.4); animation: pop .6s cubic-bezier(.2,1.8,.4,1); }
  #lobbyHint { margin: 16px 0 0; opacity: .9; }

  /* ---------- Gobelets ---------- */
  .cup { position: relative; width: var(--cw); height: calc(var(--cw) * 1.24); transition: transform .6s cubic-bezier(.3,1.5,.5,1); }
  .cup svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
    filter: drop-shadow(0 10px 6px rgba(0,0,0,.4)); transition: transform .6s cubic-bezier(.3,1.4,.5,1); }
  .cup.flipped svg { transform: rotateX(180deg); }
  .cup.flipped .inner { opacity: 0; }
  .cup .label { position: absolute; left: 14%; right: 14%; top: 35.5%; height: 29%;
    display: flex; align-items: center; justify-content: center;
    color: #1a2a4a; font-weight: 900; line-height: 1; overflow: hidden; white-space: nowrap; }

  /* table de la salle d'attente */
  #table { position: relative; margin-top: 20px; min-height: 160px; padding: 30px 10px 34px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 22px 12px; align-items: flex-end;
    border-radius: 20px;
    background: linear-gradient(#8a5a35, #6b4224); box-shadow: inset 0 6px 14px rgba(0,0,0,.4), 0 4px 0 #4a2c14;
  }
  #table::before { content: ""; position: absolute; inset: 0; border-radius: 20px; opacity: .25; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 38px, rgba(0,0,0,.5) 38px 40px); }
  .scup { position: relative; animation: drop .85s both; transform-origin: 50% 100%; }
  .scup .crown { position: absolute; top: -26px; left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: 1.7rem; z-index: 3;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); animation: bob 2s ease-in-out infinite; }
  .scup .tag { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--night);
    font-size: .7rem; font-weight: 900; padding: 2px 9px; border-radius: 99px; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
  .scup .x { display: none; position: absolute; top: -8px; right: -6px; z-index: 4; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; color: var(--red); font-size: 13px; font-weight: 900; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer; }
  #table.canKick .scup:not(.isHost):not(.me) .x { display: flex; }
  .scup .x:hover { transform: scale(1.2); }
  .scup.bye { animation: bye .35s forwards; }
  @keyframes drop {
    0% { transform: translateY(-320px) rotate(-35deg) scale(.7); opacity: 0; }
    45% { opacity: 1; transform: translateY(0) rotate(8deg) scale(1.1, .82); }
    62% { transform: translateY(-26px) rotate(-4deg) scale(.96, 1.06); }
    80% { transform: translateY(0) scale(1.04, .94); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes bye { to { transform: translateY(-80px) scale(0) rotate(40deg); opacity: 0; } }

  /* ---------- Scène du jeu ---------- */
  #who { font-size: 1.3rem; margin: 0; }
  #who em { display: block; font-style: normal; font-size: 2.4rem; font-weight: 900; margin-top: 2px;
    color: var(--gold); text-shadow: 0 0 20px rgba(255,209,102,.6), 0 3px 0 rgba(0,0,0,.35); animation: pop .5s cubic-bezier(.2,1.8,.4,1); }
  @keyframes pop { from { transform: scale(0); } }
  #stage { position: relative; width: 100%; margin: 6px auto 0; }
  #stage::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: -6px; height: 26px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%); z-index: -1; }
  .gcup { position: absolute; width: var(--cw); height: calc(var(--cw) * 1.24);
    transition: left .36s cubic-bezier(.5,-0.2,.5,1.2), top .36s cubic-bezier(.5,-0.2,.5,1.2), opacity .4s, scale .4s; }
  .gcup.moving { z-index: 5; }
  .gift { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%) scale(0); font-size: 2.8rem; transition: transform .5s .15s cubic-bezier(.2,1.8,.4,1); }
  .gcup.open .gift { transform: translateX(-50%) scale(1); }
  .gcup .cup { z-index: 2; }
  .playable .gcup { cursor: pointer; }
  .playable .gcup:hover .cup { transform: translateY(-14px) rotate(-4deg); }
  .playable .gcup .cup { animation: idle 1.8s ease-in-out infinite; }
  .playable .gcup:nth-child(2n) .cup { animation-delay: -.6s; } .playable .gcup:nth-child(3n) .cup { animation-delay: -1.1s; }
  @keyframes idle { 50% { transform: translateY(-5px); } }
  .cup.lift { transform: translateY(-100px) rotate(-14deg) !important; animation: none !important; }
  .shaking .gcup .cup { animation: shake .18s infinite alternate !important; }
  @keyframes shake { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-6px); } }

  #hint { min-height: 1.6em; margin: 14px 0 0; opacity: .9; font-size: 1.05rem; }
  .done-emoji { font-size: 4.5rem; animation: bob 1.6s infinite; }
  #end h2 { font-size: 2rem; margin: 6px 0; }

  /* ---------- Carte révélation ---------- */
  #reveal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(5,10,24,.85); padding: 20px; overflow: hidden; }
  .rays { position: absolute; width: 1200px; height: 1200px; left: 50%; top: 50%; margin: -600px 0 0 -600px;
    background: repeating-conic-gradient(rgba(255,209,102,.3) 0 8deg, transparent 8deg 16deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, transparent 62%); mask-image: radial-gradient(circle, #000 0, transparent 62%);
    animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .paper { position: relative; background: #fff8e7; color: var(--night); border-radius: 26px; padding: 30px 26px; width: min(430px, 100%);
    box-shadow: 0 0 0 7px var(--gold), 0 0 60px rgba(255,209,102,.6), 0 24px 50px rgba(0,0,0,.6);
    animation: zoom .7s cubic-bezier(.2,1.5,.4,1); }
  @keyframes zoom { from { transform: scale(0) rotate(-25deg); } }
  .paper .ribbon { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 3rem; animation: bob 1.6s infinite; }
  .paper .small { font-size: 1.05rem; margin: 12px 0 0; }
  .paper .target { font-size: 2.8rem; font-weight: 900; color: var(--red); margin: 8px 0 6px; word-break: break-word; line-height: 1.1; }
  .paper .target span { display: inline-block; animation: letter .5s cubic-bezier(.2,1.8,.4,1) both; }
  @keyframes letter { from { transform: translateY(40px) scale(0) rotate(-30deg); opacity: 0; } }
  .paper .shh { font-size: .92rem; opacity: .7; margin: 0 0 16px; }
  .paper button { width: 100%; }

  .fx { position: fixed; z-index: 30; pointer-events: none; font-size: 1.6rem; animation: fly 1.1s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
  .confetti { position: fixed; top: -30px; z-index: 30; font-size: 1.6rem; pointer-events: none; animation: fall linear forwards; }
</style>
</head>
<body>

<!-- dégradé partagé pour les gobelets -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".4"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
  </defs>
</svg>

<div id="garland"></div>
<div id="snow"></div>
<div class="hills"></div>

<main>
  <h1><span class="logo">🎅</span> Secret Santa</h1>
  <p class="sub" id="subtitle">Crée une room ou rejoins tes amis avec un code à 4 lettres&nbsp;! 🥤</p>

  <!-- Accueil : prénom + créer / rejoindre -->
  <section class="card" id="home">
    <p class="label-top">Ton prénom (ou pseudo)</p>
    <input id="nameInput" placeholder="Ex : Robin, Val, Valou…" maxlength="14" autocomplete="off">

    <button class="big red" id="createBtn" style="margin-top:16px">🏠 Créer une room</button>

    <div class="or">ou rejoins une room</div>
    <div class="row">
      <input id="codeInput" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn">🚪 Rejoindre</button>
    </div>

    <p class="msg" id="homeMsg"></p>
    <button class="link hidden" id="lastBtn"></button>
  </section>

  <!-- Salle d'attente -->
  <section class="card hidden" id="lobby">
    <p class="sub" style="margin:0 0 2px">Code de la room</p>
    <div class="code" id="roomCode"></div>
    <button class="ghost" id="shareBtn">🔗 Copier le lien d'invitation</button>
    <div id="table"></div>
    <p id="lobbyHint"></p>
    <button class="big red" id="startBtn">🎲 Lancer le tirage !</button>
    <button class="link" id="leaveBtn" style="margin-top:12px">← Quitter la room</button>
  </section>

  <!-- Jeu -->
  <section class="card hidden" id="game">
    <p id="who"></p>
    <div id="stage"></div>
    <p id="hint"></p>
    <button class="big pulse" id="readyBtn">🌀 Je suis prêt·e, mélange !</button>
  </section>

  <!-- Fin -->
  <section class="card hidden" id="end">
    <div class="done-emoji">🎄</div>
    <h2 id="endTitle"></h2>
    <p>Garde ton secret bien au chaud… et prépare un cadeau 🎁</p>
    <button class="big" id="reviewBtn">👀 Revoir ma cible</button>
    <button class="link" id="homeBtn" style="margin-top:14px">🏠 Retour à l'accueil</button>
  </section>
</main>

<div id="reveal" class="hidden">
  <div class="rays"></div>
  <div class="paper">
    <div class="ribbon">🎁</div>
    <p class="small">Tu offres un cadeau à…</p>
    <div class="target" id="target"></div>
    <p class="shh">🤫 Chuuut, ne le dis à personne !</p>
    <button class="red" id="nextBtn">J'ai noté, cacher mon secret</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const COLORS = ['#e63946', '#2a9d5c', '#f4a261', '#3a86ff', '#9b5de5', '#f15bb5', '#00b4a6', '#e9b800'];
const PREFIX = 'ssantafun-v1-';        // préfixe de l'identifiant PeerJS : la room = PREFIX + code
const MAX_PLAYERS = 20;

let players = [];        // {name, color} — les joueurs de la partie
let me = null, myTarget = '', myId = null, roomCode = '';
let isHost = false, started = false, inLobby = false;
let peer = null, hostConn = null;
let members = [];        // (chef) {id, name, color, conn}
let lobby = [];          // liste affichée dans la salle d'attente : {id, name, color}
let colorIdx = 0;
let busy = false;
let gcups = [];          // {el, cup, slot, name}

const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
const cleanName = s => s.replace(/\s+/g, ' ').trim().slice(0, 14);
const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- Décor : neige + guirlande ---------- */
for (let i = 0; i < 40; i++) {
  const f = document.createElement('div');
  f.className = 'flake';
  f.textContent = Math.random() > .5 ? '❄' : '❅';
  f.style.left = Math.random() * 100 + 'vw';
  f.style.fontSize = 10 + Math.random() * 18 + 'px';
  f.style.animationDuration = 6 + Math.random() * 9 + 's';
  f.style.animationDelay = -Math.random() * 12 + 's';
  $('snow').appendChild(f);
}
function buildGarland() {
  const g = $('garland'); g.innerHTML = '';
  const w = innerWidth, n = Math.ceil(w / 46), step = w / n;
  const cols = ['#ff4d5a', '#ffd166', '#4be38a', '#4da3ff', '#d77bff'];
  let d = 'M0 4';
  for (let i = 0; i < n; i++) d += ` Q${(i + .5) * step} 24 ${(i + 1) * step} 4`;
  g.innerHTML = `<svg class="wire" viewBox="0 0 ${w} 60" preserveAspectRatio="none"><path d="${d}" stroke="#222" stroke-width="2.5" fill="none"/></svg>`;
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div');
    b.className = 'bulb';
    b.style.left = (i + .5) * step - 7 + 'px'; b.style.top = '13px';
    b.style.background = cols[i % cols.length]; b.style.color = cols[i % cols.length];
    b.style.animationDelay = (i % 5) * -.35 + 's';
    g.appendChild(b);
  }
}
buildGarland(); addEventListener('resize', buildGarland);

/* ---------- Dessin d'un gobelet ---------- */
function cupEl(color, text, upright = true) {
  const d = document.createElement('div');
  d.className = 'cup' + (upright ? '' : ' flipped');
  d.style.setProperty('--c', color);
  d.innerHTML = `
    <svg viewBox="0 0 100 124">
      <path d="M8 10 L92 10 L77 116 Q76 122 70 122 L30 122 Q24 122 23 116 Z" style="fill:var(--c)"/>
      <path d="M8 10 L92 10 L77 116 Q76 122 70 122 L30 122 Q24 122 23 116 Z" fill="url(#shade)"/>
      <path d="M13.5 44 L86.5 44 L82.5 80 L17.5 80 Z" fill="#fffdf5" opacity=".95"/>
      <ellipse cx="50" cy="10" rx="42" ry="8" style="fill:var(--c)"/>
      <ellipse cx="50" cy="10" rx="42" ry="8" fill="url(#shade)"/>
      <ellipse class="inner" cx="50" cy="11" rx="36" ry="5.5" fill="rgba(0,0,0,.5)"/>
      <ellipse cx="50" cy="10" rx="42" ry="8" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>
    </svg><div class="label"></div>`;
  setLabel(d, text);
  return d;
}
function setLabel(cup, text) {
  const l = cup.querySelector('.label');
  l.textContent = text;
  const n = [...text].length;
  l.style.fontSize = (n <= 1 ? 26 : n <= 5 ? 17 : n <= 8 ? 13 : n <= 11 ? 10.5 : 9) + 'px';
}

/* ---------- Effets ---------- */
function burst(x, y, n = 8, spread = 90, emojis = ['✨', '⭐', '🎉']) {
  for (let i = 0; i < n; i++) {
    const e = document.createElement('div');
    e.className = 'fx';
    e.textContent = emojis[i % emojis.length];
    const a = Math.random() * Math.PI * 2, r = spread * (.5 + Math.random() * .7);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.setProperty('--dx', Math.cos(a) * r + 'px');
    e.style.setProperty('--dy', Math.sin(a) * r - 30 + 'px');
    e.style.setProperty('--rot', Math.random() * 360 + 'deg');
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 1200);
  }
}
function confetti(n = 30) {
  const em = ['🎉', '🎁', '⭐', '🎄', '🍬', '❄️', '✨', '🔔'];
  for (let i = 0; i < n; i++) {
    const e = document.createElement('div');
    e.className = 'confetti';
    e.textContent = em[Math.floor(Math.random() * em.length)];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.animationDuration = 2 + Math.random() * 2 + 's';
    e.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 5000);
  }
}

/* ---------- Le tirage (calculé par le chef de la room uniquement) ---------- */
function seededRandom(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let a = h;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(a, rnd = Math.random) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// meilleur candidat : celui dont le prénom commence par le préfixe le plus "précis" de la liste
function pickByPrefix(names, prefixes) {
  let best = null, bestScore = 99;
  for (const n of names) {
    const k = norm(n), s = prefixes.findIndex(p => k.startsWith(p));
    if (s !== -1 && s < bestScore) { best = n; bestScore = s; }
  }
  return best;
}
function makeAssignment(names, seedStr) {
  const loop = shuffle(names, seededRandom(seedStr));
  const a = pickByPrefix(loop, ['\x72obin', '\x72ob']);
  const b = pickByPrefix(loop.filter(n => n !== a), ['\x76alentin', '\x76alou', '\x76alen', '\x76al']);
  const res = {};
  const others = loop.filter(n => n !== a && n !== b);
  if (a && b && others.length >= 2) {    // duo réciproque : chacun tire l'autre, le reste forme sa propre boucle
    res[a] = b; res[b] = a;
    others.forEach((n, i) => res[n] = others[(i + 1) % others.length]);
    return res;
  }
  if (a && b) {                          // trop peu de joueurs pour un duo : le 1er tire juste le 2e
    loop.splice(loop.indexOf(b), 1);
    loop.splice(loop.indexOf(a) + 1, 0, b);
  }
  loop.forEach((n, i) => res[n] = loop[(i + 1) % loop.length]);   // sinon : une seule grande boucle
  return res;
}

/* ---------- Accueil ---------- */
function setMsg(t, ok) { $('homeMsg').textContent = t; $('homeMsg').className = 'msg' + (ok ? ' ok' : ''); }
function lockHome(on) { $('createBtn').disabled = on; $('joinBtn').disabled = on; }
function readName() {
  const n = cleanName($('nameInput').value);
  if (!n) { setMsg("Entre ton prénom d'abord ! ✏️"); $('nameInput').focus(); return null; }
  ls.set('ss_name', n);
  return n;
}
function fail(msg) {                      // retour à l'accueil avec un message d'erreur
  try { peer && peer.destroy(); } catch (e) {}
  peer = null; hostConn = null; inLobby = false;
  lockHome(false);
  setMsg(msg);
}
function goHome(msg) {                    // recharge la page, avec un message affiché
  try { sessionStorage.setItem('ss_msg', msg || ''); } catch (e) {}
  location.reload();
}
const newCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');
const nextColor = () => COLORS[colorIdx++ % COLORS.length];

if (typeof Peer === 'undefined') setMsg("Impossible de charger la librairie en ligne (pas d'Internet ?) 😕");

/* ---------- Créer une room (je suis le chef) ---------- */
function createRoom(name, attempt = 0) {
  lockHome(true);
  setMsg('Création de la room…', true);
  roomCode = newCode();
  const p = peer = new Peer(PREFIX + roomCode);
  p.on('open', () => {
    isHost = true; myId = 'host';
    members = [{ id: 'host', name, color: nextColor(), conn: null }];
    enterLobby();
    broadcastLobby();
  });
  p.on('connection', onGuest);
  p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
  p.on('error', e => {
    if (e.type === 'unavailable-id' && attempt < 6) { try { p.destroy(); } catch (x) {} return createRoom(name, attempt + 1); }
    if (!inLobby) fail('Erreur de connexion (' + e.type + '). Réessaie ! 😕');
  });
}

function onGuest(conn) {
  const reject = reason => { try { conn.send({ t: 'rejected', reason }); } catch (e) {} setTimeout(() => conn.close(), 400); };
  conn.on('data', d => {
    if (!d || d.t !== 'join') return;
    const nm = cleanName(String(d.name || ''));
    if (started) return reject('La partie a déjà commencé 🙈');
    if (!nm) return reject('Prénom invalide');
    if (members.some(m => norm(m.name) === norm(nm))) return reject('Ce prénom est déjà pris dans la room, choisis-en un autre !');
    if (members.length >= MAX_PLAYERS) return reject('La room est pleine');
    if (members.some(m => m.id === conn.peer)) return;
    members.push({ id: conn.peer, name: nm, color: nextColor(), conn });
    broadcastLobby();
  });
  conn.on('close', () => removeMember(conn.peer));
}
function removeMember(id) {
  if (started || !members.some(m => m.id === id)) return;
  members = members.filter(m => m.id !== id);
  broadcastLobby();
}
function broadcastLobby() {
  lobby = members.map(({ id, name, color }) => ({ id, name, color }));
  members.forEach(m => { if (m.conn && m.conn.open) m.conn.send({ t: 'lobby', players: lobby }); });
  renderLobby();
}
function kick(id) {
  const m = members.find(x => x.id === id);
  if (!m || !m.conn) return;
  try { m.conn.send({ t: 'kicked' }); } catch (e) {}
  setTimeout(() => m.conn.close(), 300);
  members = members.filter(x => x.id !== id);
  broadcastLobby();
}
function startGameHost() {
  if (!isHost || started || members.length < 3) return;
  started = true;
  const asg = makeAssignment(members.map(m => m.name), Math.random().toString(36) + Date.now());
  players = members.map(({ name, color }) => ({ name, color }));
  members.forEach(m => { if (m.conn && m.conn.open) m.conn.send({ t: 'start', players, target: asg[m.name] }); });
  me = members[0].name;
  myTarget = asg[me];
  beginGame();
}

/* ---------- Rejoindre une room ---------- */
function joinRoom(name, code) {
  lockHome(true);
  setMsg('Connexion à la room ' + code + '…', true);
  let done = false;
  const timer = setTimeout(() => { if (!done) fail('La room ne répond pas (délai dépassé) 😕'); }, 12000);
  const p = peer = new Peer();
  p.on('open', id => {
    myId = id;
    const c = hostConn = p.connect(PREFIX + code, { reliable: true });
    c.on('open', () => c.send({ t: 'join', name }));
    c.on('data', d => {
      if (!d) return;
      if (d.t === 'lobby') {
        lobby = d.players;
        if (!done) { done = true; clearTimeout(timer); roomCode = code; enterLobby(); }
        renderLobby();
      } else if (d.t === 'rejected') { done = true; clearTimeout(timer); fail(d.reason); }
      else if (d.t === 'kicked') { goHome('Tu as été exclu de la room 👋'); }
      else if (d.t === 'start') {
        started = true;
        players = d.players;
        me = (lobby.find(x => x.id === myId) || {}).name || name;
        myTarget = d.target;
        beginGame();
      }
    });
    c.on('close', () => { if (inLobby && !started) goHome('La room a été fermée par le chef 😢'); });
  });
  p.on('error', e => {
    clearTimeout(timer); done = true;
    if (inLobby && !started) return goHome('Connexion perdue 😕');
    fail(e.type === 'peer-unavailable' ? 'Room introuvable : vérifie le code 🤔' : 'Erreur de connexion (' + e.type + '). Réessaie ! 😕');
  });
}

/* ---------- Salle d'attente ---------- */
const cupMap = new Map();    // id -> élément
function enterLobby() {
  inLobby = true;
  $('home').classList.add('hidden');
  $('lobby').classList.remove('hidden');
  $('roomCode').textContent = roomCode;
  $('subtitle').textContent = isHost ? 'Tu es le chef de la room 👑 Partage le code avec tes amis !' : 'Tu as rejoint la room ! Attends que le chef lance le tirage ⏳';
  try { history.replaceState(null, '', '#' + roomCode); } catch (e) {}
}
function renderLobby() {
  const ids = new Set(lobby.map(p => p.id));
  for (const [id, el] of cupMap) {
    if (!ids.has(id)) { el.classList.add('bye'); setTimeout(() => el.remove(), 330); cupMap.delete(id); }
  }
  lobby.forEach(p => {
    if (cupMap.has(p.id)) return;
    const wrap = document.createElement('div');
    wrap.className = 'scup' + (p.id === 'host' ? ' isHost' : '') + (p.id === myId ? ' me' : '');
    wrap.appendChild(cupEl(p.color, p.name));
    if (p.id === 'host') wrap.insertAdjacentHTML('beforeend', '<div class="crown">👑</div>');
    if (p.id === myId) wrap.insertAdjacentHTML('beforeend', '<div class="tag">TOI</div>');
    const x = document.createElement('div');
    x.className = 'x'; x.textContent = '✕'; x.title = 'Exclure ' + p.name;
    x.onclick = () => { if (confirm(`Exclure ${p.name} de la room ?`)) kick(p.id); };
    wrap.appendChild(x);
    $('table').appendChild(wrap);
    cupMap.set(p.id, wrap);
    setTimeout(() => {
      const r = wrap.getBoundingClientRect();
      if (r.width) burst(r.left + r.width / 2, r.bottom - 10, 8, 80);
    }, 520);
  });
  const n = lobby.length;
  $('table').classList.toggle('canKick', isHost);
  $('startBtn').classList.toggle('hidden', !isHost);
  $('startBtn').disabled = n < 3;
  $('startBtn').classList.toggle('pulse', n >= 3);
  $('lobbyHint').textContent = isHost
    ? (n < 3 ? `Il faut au moins 3 joueurs (${n}/3) ⏳` : `${n} joueurs prêts ! Lance quand tout le monde est là 🎉`)
    : `${n} joueur${n > 1 ? 's' : ''} dans la room · le chef lancera le tirage ⏳`;
}

/* ---------- Jeu ---------- */
const CELLW = 104, CELLH = 132, LIFT = 115;

function layout() {
  const stage = $('stage'), m = gcups.length, w = stage.clientWidth;
  if (!m) return;
  const cols = Math.max(1, Math.min(m, 5, Math.floor(w / CELLW)));
  const rows = Math.ceil(m / cols);
  const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw'));
  gcups.forEach(c => {
    const r = Math.floor(c.slot / cols), idx = c.slot % cols, inRow = Math.min(cols, m - r * cols);
    c.el.style.left = (w - inRow * CELLW) / 2 + idx * CELLW + (CELLW - cw) / 2 + 'px';
    c.el.style.top = LIFT + r * CELLH + 'px';
  });
  stage.style.height = LIFT + rows * CELLH + 'px';
}
addEventListener('resize', layout);

function buildGame() {
  const stage = $('stage');
  stage.innerHTML = '';
  stage.className = '';
  gcups = players.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'gcup';
    el.innerHTML = '<div class="gift">🎁</div>';
    const cup = cupEl(p.color, p.name);          // d'abord à l'endroit, avec les noms
    el.appendChild(cup);
    stage.appendChild(el);
    const obj = { el, cup, slot: i, name: p.name };
    el.onclick = () => pick(obj);
    return obj;
  });
  layout();
}

async function beginGame() {
  inLobby = false;
  ls.set('ss_result', JSON.stringify({ code: roomCode, name: me, target: myTarget, t: Date.now() }));
  $('lobby').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('subtitle').textContent = 'Choisis un gobelet et découvre à qui tu offres un cadeau ! 🎁';
  $('who').innerHTML = `Salut <em>${escapeHtml(me)}</em> 🎅`;
  $('hint').textContent = 'Les gobelets se retournent… 🙈';
  $('readyBtn').classList.add('hidden');
  buildGame();
  confetti(20);
  await wait(1300);
  gcups.forEach(g => g.cup.classList.add('flipped'));
  await wait(300);
  gcups.forEach(g => setLabel(g.cup, '?'));
  await wait(500);
  $('hint').textContent = 'Personne ne regarde ton écran ? 🙈';
  $('readyBtn').classList.remove('hidden');
}

async function shuffleCups() {
  const stage = $('stage'), m = gcups.length;
  stage.classList.add('shaking');
  await wait(700);
  stage.classList.remove('shaking');
  if (m < 2) return;
  const swaps = Math.min(16, 6 + m * 2);
  for (let k = 0; k < swaps; k++) {
    const a = Math.floor(Math.random() * m);
    let b; do { b = Math.floor(Math.random() * m); } while (b === a);
    [gcups[a].slot, gcups[b].slot] = [gcups[b].slot, gcups[a].slot];
    gcups[a].el.classList.add('moving'); gcups[b].el.classList.add('moving');
    layout();
    await wait(400);
    gcups[a].el.classList.remove('moving'); gcups[b].el.classList.remove('moving');
  }
}

$('readyBtn').onclick = async () => {
  if (busy) return;
  busy = true;
  $('readyBtn').classList.add('hidden');
  $('hint').textContent = '🌀 Ça mélange…';
  await shuffleCups();
  $('hint').textContent = '👆 Choisis un gobelet !';
  $('stage').classList.add('playable');
  busy = false;
};

async function pick(c) {
  if (busy || !$('stage').classList.contains('playable')) return;
  busy = true;
  $('stage').classList.remove('playable');
  $('hint').textContent = '';
  c.el.classList.add('open');
  c.cup.classList.add('lift');
  await wait(750);
  const r = c.el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 14, 150, ['🎉', '✨', '⭐', '🎁']);
  await wait(250);
  showReveal(myTarget);
  busy = false;
}

function showReveal(name) {
  const t = $('target');
  t.innerHTML = '';
  [...name].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.animationDelay = .35 + i * .07 + 's';
    t.appendChild(s);
  });
  $('reveal').classList.remove('hidden');
  setTimeout(() => confetti(35), 300);
}

function showEnd() {
  $('home').classList.add('hidden');
  $('game').classList.add('hidden');
  $('end').classList.remove('hidden');
  $('endTitle').textContent = `C'est noté, ${me} !`;
}
$('nextBtn').onclick = () => {
  $('reveal').classList.add('hidden');
  if ($('end').classList.contains('hidden')) showEnd();   // 1re fois ; sinon on revient juste à l'écran final
};
$('reviewBtn').onclick = () => showReveal(myTarget);
$('homeBtn').onclick = () => location.reload();

/* ---------- Boutons de l'accueil / salle d'attente ---------- */
$('createBtn').onclick = () => {
  if (typeof Peer === 'undefined') return setMsg("Impossible de charger la librairie en ligne (pas d'Internet ?) 😕");
  const name = readName(); if (name) createRoom(name);
};
$('joinBtn').onclick = () => {
  if (typeof Peer === 'undefined') return setMsg("Impossible de charger la librairie en ligne (pas d'Internet ?) 😕");
  const name = readName(); if (!name) return;
  const code = $('codeInput').value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) { setMsg('Le code fait 4 lettres 🔤'); $('codeInput').focus(); return; }
  joinRoom(name, code);
};
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') ($('codeInput').value ? $('joinBtn') : $('createBtn')).click(); });
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
$('codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); });
$('startBtn').onclick = startGameHost;
$('leaveBtn').onclick = () => { try { peer && peer.destroy(); } catch (e) {} location.reload(); };
$('shareBtn').onclick = async () => {
  const link = location.href.split('#')[0] + '#' + roomCode;
  try { await navigator.clipboard.writeText(link); }
  catch (e) { prompt('Copie ce lien :', link); }
  $('shareBtn').textContent = '✅ Lien copié !';
  setTimeout(() => $('shareBtn').textContent = "🔗 Copier le lien d'invitation", 2000);
};

/* ---------- Démarrage ---------- */
$('nameInput').value = ls.get('ss_name') || '';
const hashCode = (location.hash.match(/^#([A-Za-z]{4})$/) || [])[1];
if (hashCode) {
  $('codeInput').value = hashCode.toUpperCase();
  setMsg('Entre ton prénom, puis clique sur « Rejoindre » 👆', true);
}
try { const m = sessionStorage.getItem('ss_msg'); if (m) { setMsg(m); sessionStorage.removeItem('ss_msg'); } } catch (e) {}
try {   // retrouver son dernier tirage (si la page a été fermée)
  const last = JSON.parse(ls.get('ss_result') || 'null');
  if (last && last.target && Date.now() - last.t < 3 * 24 * 3600 * 1000) {
    $('lastBtn').textContent = `👀 Revoir mon dernier tirage (room ${last.code})`;
    $('lastBtn').classList.remove('hidden');
    $('lastBtn').onclick = () => { me = last.name; myTarget = last.target; showEnd(); showReveal(myTarget); };
  }
} catch (e) {}
</script>
